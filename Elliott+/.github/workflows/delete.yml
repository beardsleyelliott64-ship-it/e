name: Delete repository files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-all-files:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete app and uploaded ZIP files
        shell: bash
        run: |
          rm -rf "Elliott" "Elliott+"

          shopt -s nullglob
          for zip in ./*.zip; do
            rm -f -- "$zip"
          done

      - name: Commit deletion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to delete."
            exit 0
          fi

          git commit -m "Delete Elliott files"
          git push
