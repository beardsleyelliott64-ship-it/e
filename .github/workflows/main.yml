name: Install Elliott+ ZIP

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found in the repository root."
            exit 1
          fi
          echo "Using: $ZIP"
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract Elliott+ app
        shell: bash
        run: |
          ZIP="${{ steps.zip.outputs.path }}"
          rm -rf .elliott_extract
          mkdir -p .elliott_extract
          unzip -q -o "$ZIP" -d .elliott_extract

          shopt -s dotglob nullglob
          entries=(.elliott_extract/*)

          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            SOURCE="${entries[0]}"
          else
            SOURCE=".elliott_extract"
          fi

          # Find the Elliott+ app folder in the ZIP.
          if [ -d "$SOURCE/Elliott+" ]; then
            SOURCE="$SOURCE/Elliott+"
          elif [ -d "$SOURCE/elliott-plus" ]; then
            SOURCE="$SOURCE/elliott-plus"
          fi

          mkdir -p "Elliott+"
          cp -a "$SOURCE"/. "Elliott+/"

          # Never copy or modify GitHub workflow files.
          rm -rf .elliott_extract

      - name: Commit installed app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Elliott+

          if git diff --cached --quiet; then
            echo "No Elliott+ file changes to commit."
            exit 0
          fi

          git commit -m "Install Elliott+ from uploaded ZIP"
          git push
