name: Delete repository files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-all-files:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete all repository files except .git
        shell: bash
        run: |
          shopt -s dotglob nullglob
          for item in * .[^.]*; do
            [ "$item" = ".git" ] && continue
            rm -rf -- "$item"
          done

      - name: Commit deletion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Repository is already empty."
            exit 0
          fi

          git commit -m "Delete repository files"
          git push
